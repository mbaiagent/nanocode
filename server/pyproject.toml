[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanocode-server"
version = "0.2.0"
description = "nanocode 多用户部署的控制面和模型网关（纯标准库）"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["nanocode"]

# 可选驱动：配了 NCS_DATABASE_URL / NCS_REDIS_URL 才需要；不装就用内置的 SQLite / 进程内存。
# 本地单机模式（nanocode 本体）一个都不需要。
[project.optional-dependencies]
postgres = ["psycopg[binary]"]
redis = ["redis"]
all = ["psycopg[binary]", "redis"]

[project.scripts]
nanocode-server = "nanocode_server.__main__:main"

[tool.setuptools.packages.find]
include = ["nanocode_server*"]

[tool.setuptools.package-data]
"nanocode_server" = ["static/*"]
