<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · nanocode</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%236366f1%27/%3E%3Cstop offset=%271%27 stop-color=%27%23ec4899%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27url(%23g)%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27monospace%27 font-weight=%27700%27 font-size=%2718%27 fill=%27white%27 text-anchor=%27middle%27%3En%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="login-page">
  <div class="login-card">
    <div class="brand"><span class="brand-mark">n</span>nanocode</div>
    <h1>登录</h1>
    <p class="sub">多用户 Agent 平台 · 开发模式</p>
    <form id="form" novalidate>
      <div class="field">
        <label for="user">用户名</label>
        <input id="user" class="input" autocomplete="username" placeholder="例如 alice" maxlength="64" required autofocus>
      </div>
      <div class="field">
        <span class="muted" style="font-size:12.5px">快速选择</span>
      </div>
      <div class="quick" id="quick"></div>
      <div class="form-error" id="err" role="alert"></div>
      <button class="btn primary block lg" type="submit" id="submit">登录</button>
    </form>
    <div class="note">
      开发模式下输入任意用户名即可登录。不同用户的会话、工作区、API Key 和用量完全隔离。
      用不同的浏览器或无痕窗口，可以同时以多个用户登录。
    </div>
  </div>
</main>
<script>
const COLORS = ["#4f46e5", "#0e9384", "#dd2590", "#f79009", "#2e90fa", "#7a5af8"];
const color = (name) => COLORS[[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const quick = document.getElementById("quick");
for (const name of ["alice", "bob", "carol", "dave"]) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip";
  b.innerHTML = `<span class="avatar" style="background:${color(name)}">${name[0].toUpperCase()}</span>${name}`;
  b.onclick = () => login(name);
  quick.append(b);
}
async function login(name) {
  const err = document.getElementById("err"), btn = document.getElementById("submit");
  err.textContent = ""; btn.disabled = true;
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ user: name }) });
    const d = await r.json();
    if (d.ok) location.href = "/";
    else err.textContent = d.error;
  } catch (e) { err.textContent = "登录失败：" + e.message; }
  finally { btn.disabled = false; }
}
document.getElementById("form").onsubmit = (e) => {
  e.preventDefault();
  const name = document.getElementById("user").value.trim();
  if (!name) { document.getElementById("err").textContent = "请输入用户名"; return; }
  login(name);
};
</script>
</body>
</html>
