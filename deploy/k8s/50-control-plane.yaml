# 控制面：一个副本（会话表在 SQLite 里，见 server/README.md 的"局限"），数据放在持久卷上。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ncs-control
  namespace: nanocode-system
---
# 只给控制面在沙箱命名空间里管理 Pod 和持久卷的权限，别的命名空间、别的资源都碰不到
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ncs-sandbox-manager
  namespace: nanocode-sandboxes
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ncs-sandbox-manager
  namespace: nanocode-sandboxes
subjects:
  - kind: ServiceAccount
    name: ncs-control
    namespace: nanocode-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ncs-sandbox-manager
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ncs-control-data
  namespace: nanocode-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ncs-control
  namespace: nanocode-system
spec:
  replicas: 1
  strategy: {type: Recreate}      # SQLite 不能被两个副本同时写
  selector:
    matchLabels: {app: ncs-control}
  template:
    metadata:
      labels: {app: ncs-control}
    spec:
      serviceAccountName: ncs-control
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: control
          image: nanocode-server:latest
          args: [control]
          ports: [{containerPort: 8700, name: http}]
          env:
            - {name: NCS_HOST, value: "0.0.0.0"}
            - {name: NCS_PORT, value: "8700"}
            - {name: NCS_LAUNCHER, value: k8s}
            - {name: NCS_AUTH_HEADER, value: X-Forwarded-Email}     # oauth2-proxy 反向代理模式传给上游的身份头
            - {name: NCS_K8S_NAMESPACE, value: nanocode-sandboxes}
            - {name: NCS_K8S_IMAGE, value: "nanocode-sandbox:latest"}
            - {name: NCS_K8S_RUNTIME_CLASS, value: gvisor}
            - {name: NCS_K8S_CPU, value: "1"}
            - {name: NCS_K8S_MEMORY, value: 2Gi}
            - {name: NCS_K8S_WORKSPACE_SIZE, value: 10Gi}
            - {name: NCS_MAX_SANDBOXES, value: "200"}
            - {name: NCS_MAX_SESSIONS_PER_USER, value: "3"}
            - {name: NCS_IDLE_TIMEOUT, value: "1800"}
            - {name: NCS_GATEWAY_URL, value: "http://ncs-gateway.nanocode-system.svc:8080/v1"}
            - {name: NCS_MODEL, value: deepseek-chat}
            # 下面两项要和 20-sandbox-policy.yaml 一致
            - {name: NCS_SANDBOX_MODES, value: "default,accept_edits,plan,review,bypass"}
            - {name: NCS_SANDBOX_MODE, value: review}
          envFrom:
            - secretRef: {name: ncs-secrets}
          readinessProbe:
            httpGet: {path: /healthz, port: 8700}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: ncs-control-data}
---
apiVersion: v1
kind: Service
metadata:
  name: ncs-control
  namespace: nanocode-system
spec:
  selector: {app: ncs-control}
  ports:
    - {name: http, port: 8700, targetPort: 8700}
