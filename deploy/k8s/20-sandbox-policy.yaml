# 每个沙箱只读挂载的平台策略（nanocode/policy.py）。
# 内容由 `python -m nanocode_server policy` 生成（下面是用这些环境变量生成的：
#   NCS_GATEWAY_URL=http://ncs-gateway.nanocode-system.svc:8080/v1 NCS_MODEL=deepseek-chat
#   NCS_SANDBOX_MODES=default,accept_edits,plan,review,bypass NCS_SANDBOX_MODE=review）。
# 改了网关地址、模型、权限模式后要重新生成，并和控制面 Deployment 里的同名环境变量保持一致。
apiVersion: v1
kind: ConfigMap
metadata:
  name: ncs-sandbox-policy
  namespace: nanocode-sandboxes
data:
  policy.json: |
    {
      "provider": "custom",
      "protocol": "openai",
      "base_url": "http://ncs-gateway.nanocode-system.svc:8080/v1",
      "model": "deepseek-chat",
      "mode": "review",
      "allowed_modes": ["default", "accept_edits", "plan", "review", "bypass"],
      "forbid": ["hooks", "mcpServers", "verify", "permissions.allow", "headers", "rag"],
      "audit_log": "/data/home/audit.jsonl"
    }
