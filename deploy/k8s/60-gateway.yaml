# 模型网关：唯一使用真实模型 Key 的组件。状态在 PostgreSQL（会话、Key、用量）和 Redis（限流）里，可以多副本。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ncs-gateway
  namespace: nanocode-system
spec:
  replicas: 2
  selector:
    matchLabels: {app: ncs-gateway}
  template:
    metadata:
      labels: {app: ncs-gateway}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: nanocode-server:latest
          args: [gateway]
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: NCS_AUTH, value: proxy}                # 网关不处理登录，只是让配置检查按生产要求来
            - {name: NCS_GATEWAY_HOST, value: "0.0.0.0"}
            - {name: NCS_GATEWAY_PORT, value: "8080"}
            - {name: NCS_PLATFORM_BASE_URL, value: "https://api.deepseek.com/v1"}
            - {name: NCS_PLATFORM_MODELS, value: "deepseek-chat"}
            - {name: NCS_DAILY_TOKENS, value: "2000000"}
            - {name: NCS_RPM, value: "30"}
            - {name: NCS_MAX_OUTPUT_TOKENS, value: "8192"}
          envFrom:
            - secretRef: {name: ncs-secrets}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /data}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ncs-gateway
  namespace: nanocode-system
spec:
  selector: {app: ncs-gateway}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
