# 示例：真实部署用你的密钥管理方式创建（不要把真实值提交进仓库）。
#   NCS_SECRET_KEY        主密钥：签发网关令牌、加密用户的 API Key。至少 32 个字符：openssl rand -base64 48
#                         控制面和网关必须相同；换了以后，用户以前保存的 Key 就解不开了
#   NCS_PROXY_SECRET      认证代理和控制面共用，证明请求经过了认证代理：openssl rand -base64 32
#   NCS_DATABASE_URL      PostgreSQL（控制面和网关共用）
#   NCS_REDIS_URL         Redis（多副本共享的限流计数）。用了示例里的 Redis 就要带密码，
#                         和 45-postgres-redis.example.yaml 里的 REDIS_PASSWORD 一致；
#                         密码里的特殊字符要按 URL 规则转义
#   NCS_PLATFORM_API_KEY  平台提供的模型的 Key（可选；不提供平台模型就不需要）
apiVersion: v1
kind: Secret
metadata:
  name: ncs-secrets
  namespace: nanocode-system
type: Opaque
stringData:
  NCS_SECRET_KEY: "替换成至少 32 个字符的随机串"
  NCS_PROXY_SECRET: "替换成随机串"
  NCS_DATABASE_URL: "postgresql://ncs:替换成密码@ncs-postgres.nanocode-system.svc:5432/ncs"
  NCS_REDIS_URL: "redis://:替换成密码@ncs-redis.nanocode-system.svc:6379/0"
  NCS_PLATFORM_API_KEY: "替换成模型厂商的 Key（可选）"
