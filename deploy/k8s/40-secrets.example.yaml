# 示例：真实部署用你的密钥管理方式创建这两个 Secret（不要把真实值提交进仓库）。
#   NCS_TOKEN_SECRET  控制面和网关共用，签发 / 校验网关令牌，至少 32 个字符：openssl rand -base64 48
#   NCS_PROXY_SECRET  认证代理和控制面共用，证明请求经过了认证代理：openssl rand -base64 32
#   NCS_UPSTREAM_API_KEY  真实的模型 API Key，只给网关
apiVersion: v1
kind: Secret
metadata:
  name: ncs-secrets
  namespace: nanocode-system
type: Opaque
stringData:
  NCS_TOKEN_SECRET: "替换成至少 32 个字符的随机串"
  NCS_PROXY_SECRET: "替换成随机串"
---
apiVersion: v1
kind: Secret
metadata:
  name: ncs-upstream
  namespace: nanocode-system
type: Opaque
stringData:
  NCS_UPSTREAM_API_KEY: "替换成模型厂商的 API Key"
