# 机器上已经有 nginx（占着 80/443）时，用它代替 Caddy 做 HTTPS 和反向代理。
# 放到 /etc/nginx/sites-available/nanocode 并软链到 sites-enabled，然后：
#   sudo certbot --nginx -d nanocode.example.com      # 申请证书并自动改写 listen 443 / ssl_* 配置
#   sudo nginx -t && sudo systemctl reload nginx
# 控制面只听 127.0.0.1:8700（.env 里的 NCS_PORT）。

server {
    listen 80;
    listen [::]:80;
    server_name nanocode.example.com;

    # certbot --nginx 会在这里加上 443 的 listen、证书路径和 http→https 跳转
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 平台在 NCS_TRUST_FORWARDED=1 时取 X-Forwarded-For 的最后一项作客户端 IP（登录限流）：
        # $proxy_add_x_forwarded_for 把真实客户端地址追加在最后，客户端伪造的前缀没用
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 事件流（SSE）：不缓冲、长连接不超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
