name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (macOS, Python 3.12)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run core tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

  server-tests:
    name: Server tests (macOS, Python 3.12)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run server tests
        env:
          PYTHONPATH: server:server/tests:.
          PYTHONUNBUFFERED: "1"
          TMPDIR: ${{ runner.temp }}/nanocode-tests
        run: |
          mkdir -p "$TMPDIR"
          if python -m unittest discover -s server/tests -v; then
            exit 0
          else
            result=$?
            find "$TMPDIR" -name sandbox.log -type f -print -exec tail -n 60 {} \;
            exit "$result"
          fi
